# AIゲーム実況の通常設定です。
# 同じ項目をコマンドラインで指定した場合は、コマンドラインを優先します。

title = "かまいたちの夜"
model = "gpt-realtime-2.1-mini"
commentary_model = "gpt-5.6-luna"
summary_model = "gpt-5.6-luna"
voice = "marin"
# 実況者の設定。相対パスはこの設定ファイルの場所を基準にします。
persona_file = "commentator-persona.md"
# 記憶がない初回・初期化時に読む固定挨拶。
initial_intro_file = "startup-initial.txt"
# ゲームタイトル別の全体記憶。相対パスはこの設定ファイルを基準にします。
memory_dir = "output/memory"

scale = 2.0
min_confidence = 0.5
# 0は時間終了まで無制限。正数にすると画面数の安全上限になります。
max_turns = 0
# 準備完了後、この時間を過ぎたら本マークまたは選択肢で実況を締めます。
session_duration_minutes = 5.0
# 自然な区切りが来ない場合に待つ最大時間。
ending_grace_minutes = 5.0

speech_retries = 0
speech_retry_delay = 0.5
after_enter_delay = 1.0

# 文字送りマークが見つからない間にOCRを再確認する間隔。
ocr_interval = 0.5
# 空白を除いたOCR本文がこの回数連続で一致すると表示完了とみなす。
stable_ocr_samples = 3
# 安定本文で確定するとき、弱く検出した進行マークの種類を採用するしきい値。
stable_marker_candidate_score = 0.60

marker_timeout = 12.0
marker_retries = 0
marker_retry_delay = 1.0
marker_poll_interval = 0.15
marker_threshold = 0.78

timeout = 120.0
