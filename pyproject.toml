[project]
name = "ai-game-commentary"
version = "0.1.0"
description = "Capture a Windows game window and extract Japanese text with NDLOCR-Lite."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ndlocr-lite",
    "pillow>=12.1.1",
    "sounddevice>=0.5.2",
    "websocket-client>=1.8.0",
]

[project.scripts]
game-ocr = "game_window_ocr.cli:main"
game-commentary = "game_window_ocr.commentary:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_window_ocr"]

[tool.uv.sources]
ndlocr-lite = { git = "https://github.com/ndl-lab/ndlocr-lite.git", rev = "7fd36cd58df7df1270ac19c7231988a77ec980ab" }

[tool.pytest.ini_options]
testpaths = ["tests"]
